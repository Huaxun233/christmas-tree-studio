*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;margin:0;background:#03070f;}
body{
  overflow:hidden;
  color:#fff;
  font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
#stage{
  position:fixed;inset:0;
  background:#03070f;
  overflow:hidden;
  cursor:grab;
  touch-action:none;
}
#stage.dragging{cursor:grabbing;}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
#snow,#photo{pointer-events:none;}
.photo-count{font-variant-numeric:tabular-nums;}
.toast{
  position:absolute;
  left:50%;
  bottom:calc(112px + env(safe-area-inset-bottom, 0px));
  transform:translateX(-50%) translateY(6px);
  z-index:6;
  padding:8px 14px;
  border-radius:999px;
  font-size:12.5px;
  letter-spacing:.02em;
  color:rgba(232,246,255,.94);
  background:rgba(7,16,28,.86);
  border:1px solid rgba(150,205,240,.28);
  box-shadow:0 10px 24px rgba(0,0,0,.45);
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease,transform .25s ease;
  white-space:nowrap;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- 祝福语 ---------- */
.greeting{
  position:absolute;
  left:clamp(20px,3vw,52px);
  top:31%;
  z-index:3;
  pointer-events:none;
  padding-right:24px;
}
.greeting h1{
  margin:0;
  font-family:'Great Vibes','Monotype Corsiva','Apple Chancery','Segoe Script','Brush Script MT',cursive;
  font-weight:400;
  font-size:clamp(30px,4.4vw,78px);
  line-height:1.04;
  letter-spacing:.015em;
  color:#fff;
  white-space:nowrap;
  text-shadow:0 0 20px rgba(120,180,255,.12);
}
.signature{
  display:inline-block;
  min-width:2.6em;
  min-height:1.16em;
  margin-top:.16em;
  padding:0 .1em .06em;
  font-family:'Great Vibes','Monotype Corsiva','Apple Chancery','Segoe Script',cursive;
  font-size:clamp(16px,2.1vw,36px);
  line-height:1.2;
  color:rgba(255,255,255,.76);
  border-bottom:1px dashed rgba(255,255,255,.14);
  outline:none;
  cursor:text;
  pointer-events:auto;
  transition:color .25s ease,border-color .25s ease;
}
.signature:hover,.signature:focus{color:#fff;border-bottom-color:rgba(255,255,255,.42);}
.signature:focus-visible{box-shadow:0 0 0 1px rgba(255,255,255,.28) inset;}
.signature:empty::before{
  content:attr(data-placeholder);
  font-family:system-ui,-apple-system,"PingFang SC",sans-serif;
  font-size:.52em;
  letter-spacing:.08em;
  color:rgba(255,255,255,.26);
}

/* ---------- 底部：一个「功能」按钮 + 右侧抽屉 ---------- */
.dock{
  position:absolute;
  left:50%;
  bottom:calc(13px + env(safe-area-inset-bottom, 0px));
  transform:translateX(-50%);
  z-index:4;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:9px;
  padding:0 14px;
  max-width:100%;
  pointer-events:none;
}
#menuFab{
  display:inline-flex;
  align-items:center;
  gap:9px;
  height:46px;
  padding:0 20px;
  font:inherit;
  font-size:14px;
  letter-spacing:.03em;
  color:rgba(228,242,255,.9);
  background:rgba(7,16,28,.74);
  border:1px solid rgba(150,200,238,.26);
  border-radius:999px;
  cursor:pointer;
  pointer-events:auto;
  -webkit-backdrop-filter:blur(10px);

<script>
(function(){
  'use strict';

  /* ==========================================================================
     1. 场景参数 —— 与 tree.py 完全一致
     ========================================================================== */
  var VW = 1600, VH = 900;
  var PITCH = -0.25;
  var CAM_DIST = 13.0;
  var CAM_HEIGHT = 6.0;
  var TREE_HEIGHT = 12.0;
  var TAU = Math.PI * 2;

  var TREE_POINTS = 50000;   // 螺旋灯带 + 蓬松填充
  var GROUND_POINTS = 4000;  // 地面法阵光环
  var STAR_POINTS = 1200;    // 空中星点
  var HEART_POINTS = 1000;   // 树顶爱心
  var SNOW_FLAKES = 10;      // 前景大雪花

  var TOTAL = TREE_POINTS + GROUND_POINTS + STAR_POINTS + HEART_POINTS;

  /* ==========================================================================
     2. 生成粒子
     ========================================================================== */
  var DATA = new Float32Array(TOTAL * 6);   // x,y,z,r,g,b
  var BURST = new Float32Array(TOTAL * 3);  // 散开方向 x,y,z
  var BUCKET = new Uint8Array(TOTAL);       // 2D 降级渲染用的色阶
  var n = 0;

  function put(x, y, z, r, g, b){
    var o = n * 6;
    DATA[o]     = x;
    DATA[o + 1] = y;
    DATA[o + 2] = z;
    DATA[o + 3] = r / 255;
    DATA[o + 4] = g / 255;
    DATA[o + 5] = b / 255;
    n++;
  }
  function gauss(){
    var u = 1 - Math.random(), v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
  }
  function branchWave(h){
    return Math.max(0, Math.sin((h * 5.8 + 0.15) * TAU));
  }

  function buildTree(){
    var spiralN = Math.round(TREE_POINTS * 0.7);
    var loops = 9;
    var i, u, h, y, baseR, ang, r, x, z, t, ph, rr, g, b, gg;

    // 70% 螺旋灯带：高度偏下密、上疏
    for (i = 0; i < spiralN; i++){
      u = Math.random();
      h = Math.pow(u, 1.6);
      y = TREE_HEIGHT * h + 0.2;

      baseR = Math.pow(1 - h, 1.1) * 3.2;
      baseR *= 1.0 + 0.65 * branchWave(h);

      t = u * loops * TAU;
      ang = t + (Math.random() * 0.44 - 0.22);
      r = baseR * (0.85 + Math.random() * 0.23);

      x = Math.cos(ang) * r;
      z = Math.sin(ang) * r;

      // 天蓝 → 白：低处天蓝，向上柔和过渡到纯白（绿分量贴住蓝，才不会发紫）
      ph = h * h * (3 - 2 * h);
      rr = 102 + Math.round(146 * ph);
      g = 188 + Math.round(64 * ph);
      b = 236 + Math.round(14 * ph);

      rr += Math.floor(Math.random() * 12) - 4;
      gg = g + Math.floor(Math.random() * 12) - 4;
      if (rr > 255) rr = 255;
      if (gg > 255) gg = 255;

      // 点缀小灯：更亮的冷白
      if (Math.random() < 0.06){
        put(x, y, z, 252, 254, 255);
      } else {
        put(x, y, z, rr, gg, b);
      }
    }

    // 30% 随机填充，让轮廓蓬松
    var fillN = TREE_POINTS - spiralN;
    for (i = 0; i < fillN; i++){
      h = Math.pow(Math.random(), 1.9);
      y = TREE_HEIGHT * h + 0.2 + (Math.random() * 0.16 - 0.08);

      baseR = Math.pow(1 - h, 1.1) * 4.3;
      baseR *= 1.0 + 0.65 * branchWave(h);

      r = baseR * Math.sqrt(Math.random());
      ang = Math.random() * TAU;

      x = Math.cos(ang) * r + (Math.random() * 0.16 - 0.08);
      z = Math.sin(ang) * r + (Math.random() * 0.16 - 0.08);

      // 填充层：同一套天蓝，只压暗一点，和灯带衔接更软
      ph = h * h * (3 - 2 * h);
      rr = 132 + Math.round(92 * ph);
      g = 178 + Math.round(62 * ph);
      put(x, y, z, rr, g, 214 + Math.round(32 * ph));
    }
  }

  function buildGround(){
    var rings = [4.6, 6.0, 7.4, 8.8, 10.2, 11.4];
    var i, ring, r, th, x, z, c, cb;
    for (i = 0; i < GROUND_POINTS; i++){
      ring = rings[Math.floor(Math.random() * rings.length)];
      r = ring + gauss() * 0.3;
      th = Math.random() * TAU;
      x = Math.cos(th) * r;
      z = Math.sin(th) * r;
      // 地面光斑：偏天蓝的浅色雪地
      c = (Math.random() < 0.15)
        ? 176 + Math.floor(Math.random() * 34)
        : 128 + Math.floor(Math.random() * 40);
      cb = c + 100;
      if (cb > 255) cb = 255;
      put(x, -0.25, z, c, c + 58, cb);
    }
  }

  function buildStars(){
    var i, x, y, z, ph;
    for (i = 0; i < STAR_POINTS; i++){
      x = Math.random() * 36 - 18;
      z = Math.random() * 36 - 18;
      y = 3 + Math.random() * 15;
      // 空中星点：按高度取渐变，整体压暗做远景
      ph = Math.pow((y - 3) / 15, 0.8);
      put(x, y, z, 132 + Math.round(62 * ph), 184 + Math.round(54 * ph), 224 + Math.round(30 * ph));
    }
  }

  function buildHeart(){
    var made = 0, guard = 0;
    var scale = 0.9, topY = TREE_HEIGHT + 0.05;
    var x, y, f, wx, wy, wz, dist, factor, rr, g;

    while (made < HEART_POINTS && guard < HEART_POINTS * 60){
      guard++;
      x = Math.random() * 2.6 - 1.3;
      y = Math.random() * 2.8 - 1.4;

      // 隐式心形方程：(x²+y²-1)³ - x²y³ ≤ 0
      f = Math.pow(x * x + y * y - 1, 3) - x * x * y * y * y;
      if (f <= 0){
        wx = x * scale * 0.8;
        wy = topY + (y + 1) * scale * 0.5;
        wz = Math.random() * 0.36 - 0.18;

        dist = Math.sqrt(x * x + y * y);
        factor = 1.15 - 0.5 * dist;
        if (factor < 0.35) factor = 0.35;

        // 心：接近纯白的冷光，只留一丝天蓝
        rr = Math.round(234 + 20 * factor);
        g = Math.round(244 + 10 * factor);
        if (rr > 255) rr = 255;
        if (g > 255) g = 255;
        put(wx, wy, wz, rr, g, 255);
        made++;
      }
    }
  }

  function buildBuckets(){
    var i, o, lum, heartStart = TOTAL - HEART_POINTS;
    for (i = 0; i < TOTAL; i++){
      if (i >= heartStart){ BUCKET[i] = 6; continue; }
      o = i * 6;
      lum = (DATA[o + 4] + DATA[o + 5]) * 127.5;   // 近似 0-255 亮度
      if (lum > 245) BUCKET[i] = 0;
      else if (lum > 226) BUCKET[i] = 1;
      else if (lum > 208) BUCKET[i] = 2;
      else if (lum > 190) BUCKET[i] = 3;
      else if (lum > 172) BUCKET[i] = 4;
      else BUCKET[i] = 5;
    }
  }

  // 每颗粒子的“散开方向”：七成沿半径往外，三成随机，散成一团云
  function buildBurst(){
    var i, o, x, z, rl, ang, amp, radial, bx, bz, by;
    for (i = 0; i < TOTAL; i++){
      o = i * 6;
      x = DATA[o]; z = DATA[o + 2];

      rl = Math.sqrt(x * x + z * z);
      if (rl < 0.3){
        ang = Math.random() * TAU;
        rl = 1;
      } else {
        ang = Math.atan2(z, x);
      }

      amp = 1.1 + Math.random() * 2.2;      // 散开的距离
      radial = Math.random() < 0.7;

      if (radial){
        bx = Math.cos(ang) * amp;
        bz = Math.sin(ang) * amp;
      } else {
        bx = (Math.random() * 2 - 1) * amp;
        bz = (Math.random() * 2 - 1) * amp;
      }
      // 越高的地方越往上飘，贴近地面的更贴着地面散
      by = (Math.random() * 1.3 - 0.35) * amp * 0.55 + (DATA[o + 1] > 10 ? 0.5 : 0);

      BURST[i * 3] = bx;
      BURST[i * 3 + 1] = by;
      BURST[i * 3 + 2] = bz;
    }
  }

  buildTree();
  buildGround();
  buildStars();
  buildHeart();
  buildBuckets();
  buildBurst();

  /* ==========================================================================
     3. WebGL 绘制
     ========================================================================== */
  var stage = document.getElementById('stage');
  var glc = document.getElementById('gl');
  var snowc = document.getElementById('snow');
  var sctx = snowc.getContext('2d');
  var gl = null, prog = null, loc = {};
  var PW = 1, PH = 1, SCALE = 1;

  var VERT_SRC = [
    'attribute vec3 a_pos;',
    'attribute vec3 a_col;',
    'attribute vec3 a_burst;',
    'uniform float u_angle;',
    'uniform float u_scale;',
    'uniform float u_zoom;',
    'uniform float u_burst;',
    'uniform vec2 u_res;',
    'uniform float u_panY;',
    'varying vec3 v_col;',
    'varying float v_size;',
    'void main(){',
    '  vec3 p = a_pos + a_burst * u_burst;',
    '  float c = cos(u_angle), s = sin(u_angle);',
    '  float xz = p.x * c - p.z * s;',
    '  float zz = p.x * s + p.z * c;',
    '  float cp = cos(-0.25), sp = sin(-0.25);',
    '  float yp = p.y * cp - zz * sp;',
    '  float zp = p.y * sp + zz * cp;',
    '  zp = zp + 13.0;',
    '  yp = yp - 6.0;',
    '  if (zp < 0.15){',
    '    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);',
    '    gl_PointSize = 0.0;',
    '    v_col = vec3(0.0);',
    '    v_size = 0.0;',
    '    return;',
    '  }',
    '  float sc = u_scale * u_zoom;',
    '  float f = (900.0 * 0.63) / zp;',
    '  float sx = u_res.x * 0.5 + xz * f * sc;',
    '  float sy = u_res.y * 0.5 - yp * f * sc + u_panY;',
    '  gl_Position = vec4(sx / u_res.x * 2.0 - 1.0, 1.0 - sy / u_res.y * 2.0, 0.0, 1.0);',
    '  float rad = max(1.0, 3.6 - zp * 0.13);',
    '  float sz = max(1.4, rad * 2.4 * sc);',
    '  gl_PointSize = sz;',
    '  v_size = sz;',
    '  v_col = a_col;',
    '}'
  ].join('\n');

  var FRAG_SRC = [
    'precision mediump float;',
    'uniform float u_alpha;',
    'varying vec3 v_col;',
    'varying float v_size;',
    'void main(){',
    '  vec2 p = gl_PointCoord * 2.0 - 1.0;',
    '  float r = length(p);',
    // 实心圆点：只在边缘做约 1 像素的抗锯齿，保持和原版一样的硬边颗粒感
    '  float edge = (1.0 - r) * (v_size * 0.5);',
    '  float a = smoothstep(0.0, 1.1, edge) * u_alpha;',
    '  if (a < 0.02) discard;',
    '  gl_FragColor = vec4(v_col, a);',
    '}'
  ].join('\n');

  function compile(type, src){
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
      if (window.console) console.warn(gl.getShaderInfoLog(sh));
      return null;
    }
    return sh;
  }

  function initGL(){
    var opts = { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false, powerPreference: 'high-performance' };
    try {
      gl = glc.getContext('webgl', opts) || glc.getContext('experimental-webgl', opts);
    } catch (e){ gl = null; }
    if (!gl) return false;

    var vs = compile(gl.VERTEX_SHADER, VERT_SRC);
    var fs = compile(gl.FRAGMENT_SHADER, FRAG_SRC);
    if (!vs || !fs) return false;

    prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)){
      if (window.console) console.warn(gl.getProgramInfoLog(prog));
      return false;
    }
    gl.useProgram(prog);

    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, DATA, gl.STATIC_DRAW);

    var aPos = gl.getAttribLocation(prog, 'a_pos');
    var aCol = gl.getAttribLocation(prog, 'a_col');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 24, 0);
    gl.enableVertexAttribArray(aCol);
    gl.vertexAttribPointer(aCol, 3, gl.FLOAT, false, 24, 12);

    // 散开方向单独一条 buffer
    var bbuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, bbuf);
    gl.bufferData(gl.ARRAY_BUFFER, BURST, gl.STATIC_DRAW);
    var aBurst = gl.getAttribLocation(prog, 'a_burst');
    gl.enableVertexAttribArray(aBurst);
    gl.vertexAttribPointer(aBurst, 3, gl.FLOAT, false, 12, 0);

    loc.angle = gl.getUniformLocation(prog, 'u_angle');
    loc.scale = gl.getUniformLocation(prog, 'u_scale');
    loc.res = gl.getUniformLocation(prog, 'u_res');
    loc.zoom = gl.getUniformLocation(prog, 'u_zoom');
    loc.burst = gl.getUniformLocation(prog, 'u_burst');
    loc.panY = gl.getUniformLocation(prog, 'u_panY');
    loc.alpha = gl.getUniformLocation(prog, 'u_alpha');

    gl.enable(gl.BLEND);
    // 普通透明叠加：亮度不再累加，密集处不会被烧成一片白，颗粒结构能保住
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.disable(gl.DEPTH_TEST);
    return true;
  }

  var GL_OK = initGL();

  /* ==========================================================================
     4. 尺寸与取景
     ========================================================================== */
  function resize(){
    var w = stage.clientWidth || window.innerWidth;
    var h = stage.clientHeight || window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);

    var pw = Math.round(w * dpr);
    var ph = Math.round(h * dpr);

    // 按物理像素 1:1 输出，不再主动降采样（降采样会被显示器放大，画面立刻发糊）
    var MAX_PIX = 4096 * 2304;
    var k = Math.min(1, Math.sqrt(MAX_PIX / (pw * ph)));
    pw = Math.max(1, Math.round(pw * k));
    ph = Math.max(1, Math.round(ph * k));

    PW = pw; PH = ph;
    glc.width = pw; glc.height = ph;
    snowc.width = pw; snowc.height = ph;
    photoc.width = pw; photoc.height = ph;

    // 取景：树高约占画面 62%，宽度不超过 88%，窄屏自动放大
    SCALE = Math.min((0.62 * ph) / 506, (0.88 * pw) / 462);
    if (!isFinite(SCALE) || SCALE <= 0) SCALE = 1;

    if (gl){
      gl.viewport(0, 0, pw, ph);
      gl.uniform1f(loc.scale, SCALE);
      gl.uniform2f(loc.res, pw, ph);
    }
    resetSnow();
  }

  /* ==========================================================================
     5. 前景雪花
     ========================================================================== */
  var flakes = [];
  var snowSprite = null;

  function makeSprite(){
    var c = document.createElement('canvas');
    c.width = c.height = 128;
    var x = c.getContext('2d');
    var g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0.00, 'rgba(255,255,255,1)');
    g.addColorStop(0.34, 'rgba(255,255,255,0.98)');
    g.addColorStop(0.56, 'rgba(255,255,255,0.30)');
    g.addColorStop(0.80, 'rgba(255,255,255,0.09)');
    g.addColorStop(1.00, 'rgba(255,255,255,0)');
    x.fillStyle = g;
    x.beginPath();
    x.arc(64, 64, 64, 0, TAU);
    x.fill();
    return c;
  }

  function makeFlake(spawnTop){
    var r = (10 + Math.random() * 6) * SCALE;
    var v = (30 + Math.random() * 15) * SCALE;
    var y = spawnTop ? ((Math.random() * 70 - 80) * SCALE) : (Math.random() * PH * 0.5);
    var travel = PH + 80 * SCALE - y;
    var life = travel / v;
    return { x: Math.random() * PW, y: y, r: r, v: v, life: life, maxLife: life };
  }

  function resetSnow(){
    if (!snowSprite) snowSprite = makeSprite();
    flakes = [];
    for (var i = 0; i < SNOW_FLAKES; i++) flakes.push(makeFlake(true));
  }

  function updateSnow(dt){
    for (var i = 0; i < flakes.length; i++){
      var f = flakes[i];
      f.y += f.v * dt;
      f.life -= dt;
      if (f.life <= 0 || f.y > PH + 50 * SCALE) flakes[i] = f = makeFlake(true);
    }
  }

  function drawSnow(){
    sctx.clearRect(0, 0, PW, PH);
    for (var i = 0; i < flakes.length; i++){
      var f = flakes[i];
      if (f.maxLife <= 0) continue;
      var phase = f.life / f.maxLife;
      var alpha = phase > 0.3 ? 1 : phase / 0.3;
      if (alpha <= 0) continue;
      var d = f.r * 2.6;
      sctx.globalAlpha = Math.min(1, alpha);
      sctx.drawImage(snowSprite, f.x - d * 0.5, f.y - d * 0.5, d, d);
    }
    sctx.globalAlpha = 1;
  }

  /* ==========================================================================
     6. 2D 降级渲染（WebGL 不可用时）
     ========================================================================== */
  var BUCKET_STYLE = ['#ffffff', '#f3fbfe', '#e3f4fc', '#cfe9f8', '#b3dcef', '#94cae3', '#e8f7fc'];

  function render2D(angle){
    sctx.setTransform(1, 0, 0, 1, 0, 0);
    sctx.globalAlpha = 1;
    sctx.fillStyle = '#03070f';
    sctx.fillRect(0, 0, PW, PH);

    var c = Math.cos(angle), s = Math.sin(angle);
    var cp = Math.cos(PITCH), sp = Math.sin(PITCH);
    var cx = PW * 0.5, cy = PH * 0.5;
    var F = VH * 0.63;

    var b, i, o, x, y, z, xz, zz, yp, zp, f, sx, sy, rad;
    for (b = 0; b < BUCKET_STYLE.length; b++){
      sctx.fillStyle = BUCKET_STYLE[b];
      for (i = 0; i < TOTAL; i += 2){
        if (BUCKET[i] !== b) continue;
        o = i * 6;
        x = DATA[o] + BURST[i * 3] * burst;
        y = DATA[o + 1] + BURST[i * 3 + 1] * burst;
        z = DATA[o + 2] + BURST[i * 3 + 2] * burst;

        xz = x * c - z * s;
        zz = x * s + z * c;
        yp = y * cp - zz * sp;
        zp = y * sp + zz * cp + CAM_DIST;
        yp -= CAM_HEIGHT;
        if (zp < 0.15) continue;

        f = F / zp;
        sx = cx + xz * f * SCALE * zoom;
        sy = cy - yp * f * SCALE * zoom + panY;
        if (sx < -4 || sx > PW + 4 || sy < -4 || sy > PH + 4) continue;

        rad = Math.max(1, 3.6 - zp * 0.13);
        sctx.fillRect(sx, sy, rad, rad);
      }
    }
  }

  /* ==========================================================================
     7. 主循环与交互
     ========================================================================== */
  var angle = 0.32;
  var spinBase = 0.27;      // rad/s，与原来每帧 0.0045 一致
  var flingVel = 0;
  var dragging = false;
  var lastX = 0;
  var lastY = 0;
  var lastMoveT = 0;
  var lastT = 0;
  var rafId = 0;
  var running = false;
  var reduced = false;
  var paused = false;       // 暂停自转（拖动仍然有效）
  var zoom = 1, zoomTarget = 1;
  var panY = 0, panTarget = 0;

  function panLimit(){
    // 放大后允许上下挪的幅度更大，小缩放时留一点余量就够
    return PH * (0.2 + 0.3 * (zoomTarget - 1));
  }
  function clampPan(v){
    var L = panLimit();
    return Math.max(-L, Math.min(L, v));
  }
  var burst = 0, burstTarget = 0;

  try {
    reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e){ reduced = false; }

  function renderFrame(){
    if (GL_OK){
      gl.uniform1f(loc.angle, angle);
      gl.uniform1f(loc.zoom, zoom);
      gl.uniform1f(loc.burst, burst);
      gl.uniform1f(loc.panY, panY);
      gl.uniform1f(loc.alpha, 0.84 - 0.15 * burst);   // 散开后稍压一点亮度，避免糊成一片
      gl.clearColor(0.012, 0.027, 0.059, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.POINTS, 0, TOTAL);
      drawSnow();
    } else {
      render2D(angle);
      for (var i = 0; i < flakes.length; i++){
        var f = flakes[i];
        var phase = f.life / f.maxLife;
        var alpha = phase > 0.3 ? 1 : phase / 0.3;
        if (alpha <= 0) continue;
        var d = f.r * 2.6;
        sctx.globalAlpha = Math.min(1, alpha);
        sctx.drawImage(snowSprite, f.x - d * 0.5, f.y - d * 0.5, d, d);
      }
      sctx.globalAlpha = 1;
    }
    drawPhotos();
  }

  function loop(now){
    var dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 0.016;
    lastT = now;

    if (dragging){
      // 拖动时自转和惯性都让位
    } else if (paused){
      flingVel = 0;
    } else {
      angle += (spinBase + flingVel) * dt;
      flingVel *= Math.exp(-1.8 * dt);
      if (Math.abs(flingVel) < 0.008) flingVel = 0;
    }

    // 手掌转动带来的旋转：识别帧之间由这里逐帧补帧，转起来才是连续的
    if (gestureOn && burst > 0.3){
      if (performance.now() - handVelAt < 320){
        angle += handVel * dt;
      } else if (handVel){
        handVel *= Math.exp(-7 * dt);
        if (Math.abs(handVel) < 0.02) handVel = 0;
      }
    }

    // 散开/聚合、缩放都做缓动，避免硬跳
    var k = 1 - Math.exp(-dt * 6.5);
    burst += (burstTarget - burst) * k;
    zoom += (zoomTarget - zoom) * k;
    panTarget = clampPan(panTarget);
    panY += (panTarget - panY) * k;
    if (Math.abs(burstTarget - burst) < 0.0015) burst = burstTarget;
    if (Math.abs(zoomTarget - zoom) < 0.0015) zoom = zoomTarget;
    if (Math.abs(panTarget - panY) < 0.6) panY = panTarget;

    updateSnow(dt);
    updatePhotos(dt);
    renderFrame();
    rafId = window.requestAnimationFrame(loop);
  }

  function start(){
    if (running) return;
    running = true;
    lastT = 0;
    rafId = window.requestAnimationFrame(loop);
  }
  function stop(){
    running = false;
    if (rafId) window.cancelAnimationFrame(rafId);
    rafId = 0;
  }

  /* ---------- 手势：单指旋转 / 双指缩放 / 轻点散开 ---------- */
  var pointers = {};
  var pointerCount = 0;
  var pinchStartDist = 0;
  var pinchStartZoom = 1;
  var hadPinch = false;
  var downX = 0, downY = 0, downT = 0;
  var movedFar = false;
  var suppressTap = false;   // "首次点击只恢复音乐、不触发散开"

  function pinchDistance(){
    var ids = [];
    for (var id in pointers) if (pointers.hasOwnProperty(id)) ids.push(id);
    if (ids.length < 2) return 0;
    var a = pointers[ids[0]], b = pointers[ids[1]];
    var dx = a.x - b.x, dy = a.y - b.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function clampZoom(v){
    return Math.max(0.55, Math.min(2.4, v));
  }

  function endDrag(){
    if (!dragging) return;
    dragging = false;
    stage.classList.remove('dragging');
  }

  stage.addEventListener('pointerdown', function(e){
    if (e.target && e.target.closest &&
        (e.target.closest('.signature') || e.target.closest('#drawer') || e.target.closest('#menuFab') || e.target.closest('#uiPeek'))) return;

    // 菜单开着时，点树身＝收起菜单，这一下不触发“散开”
    if (drawerOpen){ setDrawerOpen(false); suppressTap = true; }

    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    pointerCount++;

    if (pointerCount === 1){
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      lastMoveT = performance.now();
      downX = e.clientX;
      downY = e.clientY;
      downT = performance.now();
      movedFar = false;
      hadPinch = false;
      flingVel = 0;
      stage.classList.add('dragging');
      try { stage.setPointerCapture(e.pointerId); } catch (err){}
    } else if (pointerCount === 2){
      // 第二根手指落下：转为缩放，取消旋转惯性
      dragging = false;
      stage.classList.remove('dragging');
      hadPinch = true;
      pinchStartDist = pinchDistance();
      pinchStartZoom = zoomTarget;
    }
  });

  stage.addEventListener('pointermove', function(e){
    if (!pointers[e.pointerId]) return;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };

    if (pointerCount >= 2){
      var d = pinchDistance();
      if (pinchStartDist > 1 && d > 1){
        zoomTarget = clampZoom(pinchStartZoom * (d / pinchStartDist));
        if (!running) renderFrame();
      }
      return;
    }

    if (!dragging) return;
    var dx = e.clientX - lastX;
    var dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    if (Math.abs(e.clientX - downX) > 6 || Math.abs(e.clientY - downY) > 6) movedFar = true;

    angle += dx * 0.0085;

    // 上下拖动：整棵树跟着走，放大后能挪到下面看被挡住的照片
    if (dy){
      var ratio = PH / Math.max(1, stage.clientHeight || window.innerHeight);
      panTarget = clampPan(panTarget + dy * ratio);
    }
    panY = panTarget;

    var now = performance.now();
    var dt = Math.max(0.008, (now - lastMoveT) / 1000);
    lastMoveT = now;
    flingVel = Math.max(-6, Math.min(6, (dx * 0.0085) / dt));
    if (!running) renderFrame();
  });

  function removePointer(e){
    if (!pointers[e.pointerId]) return;
    delete pointers[e.pointerId];
    pointerCount = Math.max(0, pointerCount - 1);

    if (pointerCount === 0){
      var wasTap = !hadPinch && !movedFar && (performance.now() - downT) < 480 && !suppressTap;
      suppressTap = false;
      endDrag();
      if (wasTap && !drawerOpen) toggleBurst();
      pinchStartDist = 0;
      hadPinch = false;
      flingVel = 0;
    }
  }

  stage.addEventListener('pointerup', removePointer);
  stage.addEventListener('pointercancel', removePointer);
  window.addEventListener('blur', function(){
    pointers = {};
    pointerCount = 0;
    hadPinch = false;
    endDrag();
  });

  // 桌面滚轮缩放
  stage.addEventListener('wheel', function(e){
    e.preventDefault();
    zoomTarget = clampZoom(zoomTarget * Math.exp(-e.deltaY * 0.0012));
    if (!running) renderFrame();
  }, { passive: false });

  // 双击复位缩放和上下位置
  stage.addEventListener('dblclick', function(e){
    if (e.target && e.target.closest &&
        (e.target.closest('.signature') || e.target.closest('#drawer') || e.target.closest('#menuFab') || e.target.closest('#uiPeek'))) return;
    zoomTarget = 1;
    panTarget = 0;
    if (!running) renderFrame();
  });

  /* ---------- 底部按钮 ---------- */
  var btnBurst = document.getElementById('btnBurst');
  var btnSpin = document.getElementById('btnSpin');
  var burstLabel = document.getElementById('burstLabel');
  var spinLabel = document.getElementById('spinLabel');

  function syncBurstUI(){
    var on = burstTarget > 0.5;
    btnBurst.setAttribute('aria-pressed', on ? 'true' : 'false');
    btnBurst.setAttribute('aria-label', on ? '聚合粒子' : '散开粒子');
    burstLabel.textContent = on ? '粒子聚合' : '粒子散开';
  }

  function toggleBurst(){
    burstTarget = burstTarget > 0.5 ? 0 : 1;
    syncBurstUI();
    if (!running){
      burst = burstTarget;
      renderFrame();
    }
  }

  function syncSpinUI(){
    btnSpin.classList.toggle('is-paused', paused);
    btnSpin.setAttribute('aria-pressed', paused ? 'true' : 'false');
    btnSpin.setAttribute('aria-label', paused ? '继续旋转' : '暂停旋转');

  btnSpin.addEventListener('click', function(){

  /* ---------- 手势：张开五指=散开 / 握拳=合拢 / 转手=旋转 ---------- */
  // 运行库和 wasm 走国内快的 npm 镜像（约 6MB/s）；模型走 MediaPipe 官方存储，并在页面空闲时后台预先下载
  // GitHub Pages 只有 30KB/s，只当兜底
  var HAND_HOSTS = [
    { script: 'https://registry.npmmirror.com/@mediapipe/tasks-vision/0.10.21/files',

    { script: 'https://hhk12312.github.io/christmas-tree',

  var HAND_MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
  var HAND_MODEL_ALT = 'https://hhk12312.github.io/christmas-tree/hand_landmarker.task';
  var handHost = HAND_HOSTS[0];
  var handLibPromise = null;
  var modelBuf = null;

  var modelPromise = null;

  var handLoading = false;

  var gestureOn = false;
  var handStream = null;
  var handVideo = document.getElementById('cam');
  var gestureBox = document.getElementById('gestureBox');
  var handStateBox = document.getElementById('handStateBox');
  var handStateTxt = document.getElementById('handState');
  var btnHand = document.getElementById('btnHand');
  var handLabel = document.getElementById('handLabel');

  var handCandidate = '';
  var handCandidateN = 0;
  var handPrevRot = null;
  var handPrevT = 0;
  var handVel = 0;
  var handVelAt = 0;
  var handPrevX = null;
  var handRotSm = 0;
  var handLastSee = 0;
  var handPumpId = 0;
  var handPumpError = null;
  var handCost = [];
  // 低配设备：先把摄像头画面缩到小画布再送识别，主线程开销能砍掉一大半
  var handSmall = document.createElement('canvas');
  handSmall.width = 320; handSmall.height = 240;
  var handSmallCtx = handSmall.getContext('2d', { willReadFrequently: true });
  var handLowPower = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
                     (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);

  function setHandState(text, cls){
    handStateTxt.textContent = text;
    handStateBox.className = 'state' + (cls ? ' ' + cls : '');
  }

  function paintIfIdle(){
    if (!running) renderFrame();
  }

  // 五指判定：用“指尖比指节更远离手腕多少”除以掌长，比绝对阈值更抗手大小、倾斜变化
  function handShape(lm){
    var palm = Math.sqrt(Math.pow(lm[9].x - lm[0].x, 2) + Math.pow(lm[9].y - lm[0].y, 2));
    if (!(palm > 0.045)) return 'mid';           // 手太远/太小，判不准就不判
    var tips = [8, 12, 16, 20], pips = [6, 10, 14, 18];
    var openN = 0, anyExt = 0;
    for (var i = 0; i < 4; i++){
      var dT = Math.sqrt(Math.pow(lm[tips[i]].x - lm[0].x, 2) + Math.pow(lm[tips[i]].y - lm[0].y, 2));
      var dP = Math.sqrt(Math.pow(lm[pips[i]].x - lm[0].x, 2) + Math.pow(lm[pips[i]].y - lm[0].y, 2));
      var e = (dT - dP) / palm;
      if (e > 0.09) openN++;
      if (e > 0.02) anyExt++;
    }
    if (openN >= 4) return 'open';
    if (anyExt === 0) return 'fist';
    return 'mid';
  }

  // 关键点跑出画面的半只手不做判断，避免“误识别”
  function handInFrame(lm){
    if (!lm || lm.length < 21) return false;
    for (var i = 0; i < 21; i++){
      var p = lm[i];
      if (!p || !isFinite(p.x) || !isFinite(p.y)) return false;
      if (p.x < -0.08 || p.x > 1.08 || p.y < -0.08 || p.y > 1.08) return false;
    }
    return true;
  }

  function applyBurstFromHand(open){
    if (open && burstTarget < 0.5){
      burstTarget = 1;
      syncBurstUI();
      paintIfIdle();
    } else if (!open && burstTarget > 0.5){
      burstTarget = 0;
      syncBurstUI();
      paintIfIdle();
    }
  }

  function onHandLandmarks(lm){
    var cls = handShape(lm);
    handLastSee = performance.now();

    // 连续 3 帧一致才切换，避免手指抖动来回跳
    if (cls !== handCandidate){
      handCandidate = cls;
      handCandidateN = 0;
    }
    handCandidateN++;
    if (cls !== 'mid' && handCandidateN >= 3) applyBurstFromHand(cls === 'open');

    setHandState(
      cls === 'open' ? '张开五指 · 散开' :
      cls === 'fist' ? '握拳 · 合拢' :
      '手势调整中',
      'live'
    );

    // 散开态下，手的转动和左右移动带动相机
    if (burst > 0.3){
      var rot = Math.atan2(lm[9].y - lm[0].y, lm[9].x - lm[0].x);
      var px = (lm[0].x + lm[9].x) * 0.5;
      var nowT = performance.now();
      if (handPrevRot !== null){
        var d = rot - handPrevRot;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        if (Math.abs(d) < 0.5){                  // 丢掉跟踪跳变
          handRotSm = handRotSm * 0.55 + d * 0.45;
          if (Math.abs(handRotSm) > 0.0045){      // 死区，免得噪声累积成漂移
            // 识别只有十几帧，这里换算成角速度交给渲染循环逐帧积分，转起来才连续
            var angDelta = -handRotSm * 1.35;    // 摄像头预览是镜像的，方向取反才跟手
            if (handPrevX !== null){
              var dxMove = px - handPrevX;
              if (Math.abs(dxMove) > 0.004 && Math.abs(dxMove) < 0.16) angDelta -= dxMove * 0.55;
            }
            var dtS = handPrevT ? Math.max(0.03, Math.min(0.45, (nowT - handPrevT) / 1000)) : 0.09;
            var vel = angDelta / dtS;
            if (vel > 2.8) vel = 2.8; else if (vel < -2.8) vel = -2.8;
            handVel = handVel * 0.45 + vel * 0.55;
            handVelAt = nowT;
          }
        } else {
          handRotSm = 0;
        }
      }
      handPrevRot = rot;
      handPrevX = px;
      handPrevT = nowT;
    } else {
      handPrevRot = null;
      handPrevX = null;
      handPrevT = 0;
      handRotSm = 0;
      handVel = 0;
    }
  }

  function onHandResults(res){
    if (!gestureOn) return;
    var lms = res && res.landmarks;
    if (!lms || !lms.length){
      if (performance.now() - handLastSee > 300){
        handCandidate = ''; handCandidateN = 0;
        handPrevRot = null; handPrevX = null;
        setHandState('未检测到手', 'warn');
      }
      return;
    }
    if (!handInFrame(lms[0])){
      if (performance.now() - handLastSee > 450) setHandState('把手放进取景框中央', 'warn');
      return;
    }
    onHandLandmarks(lms[0]);
  }

  function paintHandProgress(){
    if (gestureOn && !handModel && handLoading && modelPct > 0 && modelPct < 1){
      setHandState('模型加载中 ' + Math.round(modelPct * 100) + '%', '');
    }
  }

  function downloadModel(url){
    return fetch(url).then(function(res){
      if (!res.ok) throw new Error('model-' + res.status);
      var total = Number(res.headers.get('content-length')) || 0;
      var rd = res.body.getReader();
      var chunks = [];
      var got = 0;
      return (function step(){
        return rd.read().then(function(x){
          if (x.done){
            var buf = new Uint8Array(got);
            var off = 0;
            for (var i = 0; i < chunks.length; i++){ buf.set(chunks[i], off); off += chunks[i].length; }
            return buf;
          }
          chunks.push(x.value);
          got += x.value.length;
          if (total) modelPct = Math.min(0.99, got / total);
          paintHandProgress();
          return step();
        });
      })();
    });
  }

  function getModelBuffer(){
    if (modelPromise) return modelPromise;
    modelPromise = downloadModel(HAND_MODEL_URL)
      .catch(function(){ return downloadModel(HAND_MODEL_ALT); })
      .then(function(buf){
        modelBuf = buf;
        modelPct = 1;
        paintHandProgress();
        return buf;
      })
      .catch(function(err){
        modelPromise = null;
        throw err;
      });
    return modelPromise;
  }

  // 执行环境：npm 镜像优先，取不到再回落到自己托管的 GitHub Pages
  function loadLib(){
    if (handLibPromise) return handLibPromise;
    function tryHost(i){
      if (i >= HAND_HOSTS.length) return Promise.reject(new Error('no-host'));
      var h = HAND_HOSTS[i];
      return import(h.script + '/vision_bundle.mjs').then(function(mod){
        return mod.FilesetResolver.forVisionTasks(h.wasm).then(function(fileset){
          handHost = h;
          handLib = mod;
          return { mod: mod, fileset: fileset };
        });
      }).catch(function(){ return tryHost(i + 1); });
    }
    handLibPromise = tryHost(0).catch(function(err){
      handLibPromise = null;
      throw err;
    });
    return handLibPromise;
  }

  var handWorker = null;
  var workerReady = false;
  var workerBusy = false;
  var workerSentAt = 0;
  if (location.search.indexOf('noworker=1') >= 0) window.__noWorker = true;

  // 识别放到 Worker 里跑：主线程只负责把画面帧甩过去，动画线程不再被识别卡住
  // MediaPipe 的 wasm 加载器依赖 importScripts，module worker 里没有，这里用同步 XHR + 间接 eval 补一个
  var HAND_WORKER_CODE = [
    'self.importScripts = function(url){',
    "  var x = new XMLHttpRequest();",
    "  x.open('GET', url, false); x.send();",
    '  if (x.status >= 200 && x.status < 300){ (0, eval)(x.responseText + "\\n//# sourceURL=" + url); }',
    "  else { throw new Error('importScripts ' + x.status + ' ' + url); }",
    '};',
    'var lm = null, lastTs = 0;',
    'self.onmessage = function(ev){',
    '  var m = ev.data;',
    "  if (m.type === 'init'){",
    '    import(m.bundle).then(function(mod){',
    '      return mod.FilesetResolver.forVisionTasks(m.wasmDir).then(function(fs){',
    '        var mk = function(dl){ return mod.HandLandmarker.createFromOptions(fs, {',
    "          baseOptions: { modelAssetBuffer: new Uint8Array(m.buffer), delegate: dl },",
    "          runningMode: 'VIDEO', numHands: 1,",
    '          minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.55, minTrackingConfidence: 0.6',
    '        }); };',
    '        var order = m.preferCpu ? ["CPU", "GPU"] : ["GPU", "CPU"];',
    '        var make = function(i){',
    '          if (i >= order.length) return Promise.reject(new Error("no-delegate"));',
    '          return mk(order[i]).catch(function(){ return make(i + 1); });',
    '        };',
    '        return make(0);',
    '      });',
    '    }).then(function(x){',
    '      lm = x;',
    '      try {',  // 先在 worker 里空跑一次，把 shader/内存预热掉，手势第一帧不卡
    '        var wc = new OffscreenCanvas(320, 240), wg = wc.getContext("2d");',
    '        wg.fillStyle = "#888"; wg.fillRect(0, 0, 320, 240);',
    '        var wb = wc.transferToImageBitmap();',
    '        lm.detectForVideo(wb, 1);',
    '        wb.close(); lastTs = 1;',
    '      } catch (eWarm) {}',
    "      self.postMessage({type:'ready'});",
    '    })',
    "      .catch(function(e){ self.postMessage({type:'error', stage:'init', msg:String((e && e.message) || e)}); });",
    "  } else if (m.type === 'frame'){",
    "    if (!lm){ self.postMessage({type:'skip'}); return; }",
    '    var t0 = performance.now();',
    '    try {',
    '      lastTs = Math.max(m.ts || 0, lastTs + 1);',
    '      var res = lm.detectForVideo(m.bmp, lastTs);',
    '      var lms = (res.landmarks && res.landmarks.length) ? res.landmarks[0].map(function(p){ return {x:p.x, y:p.y, z:p.z}; }) : null;',
    "      self.postMessage({type:'result', cost: performance.now() - t0, lm: lms});",
    '    } catch (e){',
    "      self.postMessage({type:'error', stage:'detect', msg:String((e && e.message) || e)});",
    '    } finally {',
    '      try { m.bmp.close(); } catch (e2) {}',
    '    }',
    '  }',
    '};'
  ].join('\n');

  function createMainThreadModel(buf, fileset){
    function create(delegate){
      return handLib.HandLandmarker.createFromOptions(fileset, {
        baseOptions: {
          modelAssetBuffer: buf,
          delegate: delegate
        },
        runningMode: 'VIDEO',
        numHands: 1,
        minHandDetectionConfidence: 0.5,
        minHandPresenceConfidence: 0.55,
        minTrackingConfidence: 0.6
      });
    }
    create('GPU').catch(function(){ return create('CPU'); }).then(function(lm){
      handModel = lm;
      handLoading = false;
      window.__handDebug.host = handHost.script + ' (main)';
      if (gestureOn) startHandPump();
      else setHandState('就绪', '');
    }).catch(function(err){
      handLoading = false;
      setHandState(location.protocol === 'file:' ? '本地文件加载不到模型，请用启动脚本' : '模型加载失败', 'warn');
      handPumpError = (err && err.message) ? err.message : 'load-failed';
    });
  }

  function startHandWorker(buf){
    try {
      var url = URL.createObjectURL(new Blob([HAND_WORKER_CODE], { type: 'text/javascript' }));
      handWorker = new Worker(url, { type: 'module' });
    } catch (e){
      window.__noWorker = true;
      return false;
    }

    var readyTimer = window.setTimeout(function(){
      if (!workerReady){
        handPumpError = 'worker-timeout';
        window.__noWorker = true;
        try { handWorker.terminate(); } catch (e){}
        handWorker = null;
        fallbackToMainThread();
      }
    }, 8000);

    handWorker.onerror = function(){
      window.clearTimeout(readyTimer);
      if (!workerReady){
        window.__noWorker = true;
        try { handWorker.terminate(); } catch (e){}
        handWorker = null;
        fallbackToMainThread();
      }
    };

    handWorker.onmessage = function(ev){
      var d = ev.data || {};
      if (d.type === 'ready'){
        window.clearTimeout(readyTimer);
        workerReady = true;
        handLoading = false;
        window.__handDebug.host = handHost.script + ' (worker)';
        if (gestureOn) startHandPump();
        else setHandState('就绪', '');
      } else if (d.type === 'result'){
        workerBusy = false;
        if (typeof d.cost === 'number'){
          handCost.push(d.cost);
          if (handCost.length > 30) handCost.shift();
        }
        onHandResults({ landmarks: d.lm ? [d.lm] : [] });
      } else if (d.type === 'skip'){
        workerBusy = false;
      } else if (d.type === 'error'){
        workerBusy = false;
        handPumpError = d.msg || 'worker-error';
        workerReady = false;
        window.clearTimeout(readyTimer);
        try { handWorker.terminate(); } catch (e){}
        handWorker = null;
        // Worker 里出问题就整体退回主线程版本，不再反复重启
        window.__noWorker = true;
        fallbackToMainThread();
      }
    };

    handWorker.postMessage({
      type: 'init',
      bundle: handHost.script + '/vision_bundle.mjs',
      wasmDir: handHost.wasm,
      buffer: buf,
      preferCpu: location.search.indexOf('handcpu=1') >= 0
    });
    return true;
  }

  var fallbackStarted = false;
  function fallbackToMainThread(){
    if (handModel || fallbackStarted) return;
    if (!modelBuf){
      handLoading = false;
      setHandState('模型加载失败', 'warn');
      return;
    }
    fallbackStarted = true;
    handLoading = true;
    Promise.all([loadLib(), Promise.resolve(modelBuf)]).then(function(v){
      createMainThreadModel(v[1], v[0].fileset);
    }).catch(function(err){
      fallbackStarted = false;
      handLoading = false;
      setHandState(location.protocol === 'file:' ? '本地文件加载不到模型，请用启动脚本' : '模型加载失败', 'warn');
    });
  }

  function ensureHandModel(){
    if (handLoading || handModel || workerReady) return;
    handLoading = true;
    if (!modelPct) setHandState('模型加载中…', '');
    else paintHandProgress();

    Promise.all([loadLib(), getModelBuffer()]).then(function(v){
      if (!window.__noWorker){
        var started = startHandWorker(v[1]);
        if (!started){
          window.__noWorker = true;
          createMainThreadModel(v[1], v[0].fileset);
        }
      } else {
        createMainThreadModel(v[1], v[0].fileset);
      }
    }).catch(function(err){
      handLoading = false;
      setHandState(location.protocol === 'file:' ? '本地文件加载不到模型，请用启动脚本' : '模型加载失败', 'warn');
      handPumpError = (err && err.message) ? err.message : 'load-failed';
    });
  }

  // 页面空闲时后台预载，点「手势模式」就不用等
  function prefetchHandAssets(){
    var c = navigator.connection || {};
    if (c.saveData) return;
    if (c.effectiveType && /2g|3g/.test(c.effectiveType)) return;
    getModelBuffer().catch(function(){});
    loadLib().catch(function(){});
  }

  // 抓一帧给 Worker：优先 createImageBitmap（异步、不占主线程），失败再退回画布
  function frameBitmap(){
    if (window.createImageBitmap){
      return createImageBitmap(handVideo).catch(function(){
        handSmallCtx.drawImage(handVideo, 0, 0, handSmall.width, handSmall.height);
        if (handSmall.transferToImageBitmap) return Promise.resolve(handSmall.transferToImageBitmap());
        return createImageBitmap(handSmall);
      });
    }
    handSmallCtx.drawImage(handVideo, 0, 0, handSmall.width, handSmall.height);
    if (handSmall.transferToImageBitmap) return Promise.resolve(handSmall.transferToImageBitmap());
    return createImageBitmap(handSmall);
  }

  function startHandPump(){
    if (handPumpId) return;
    var lastSent = 0;
    var avgCost = 0;
    (function pump(){
      if (!gestureOn){ handPumpId = 0; return; }
      var now = performance.now();
      var videoOk = handVideo.readyState >= 2 && handVideo.currentTime > 0;

      if (workerReady){
        // Worker 模式：主线程只负责按时抓一帧丢过去，识别全程不占动画线程
        if (handWorker && !workerBusy && videoOk && now - lastSent > 90){
          lastSent = now;
          workerBusy = true;
          var ts = Math.round(now);
          frameBitmap().then(function(bmp){
            if (!handWorker || !gestureOn){
              workerBusy = false;
              try { bmp.close(); } catch (e){}
              return;
            }
            handWorker.postMessage({ type: 'frame', bmp: bmp, ts: ts }, [bmp]);
          }).catch(function(){ workerBusy = false; });
        }
      } else if (handModel && videoOk){
        // 兜底：Worker 不可用时退回主线程识别，尽量把间隔拉长减少卡顿
        var gap = handLowPower ? 120 : 70;
        if (avgCost > 0){
          if (avgCost > 45) gap = Math.min(320, Math.round(avgCost * 4));
          else if (avgCost > 28) gap = Math.min(220, Math.round(avgCost * 3.2));
        }
        if (now - lastSent > gap){
          lastSent = now;
          try {
            var t0 = performance.now();
            var res = handModel.detectForVideo(handVideo, Math.round(now));
            var cost = performance.now() - t0;
            handCost.push(cost);
            if (handCost.length > 30) handCost.shift();
            avgCost = avgCost === 0 ? cost : (avgCost * 0.75 + cost * 0.25);
            onHandResults(res);
          } catch (err){
            handPumpError = (err && err.message) ? err.message : 'detect-failed';
            setHandState('识别器异常，重启中', 'warn');
            try { handModel.close(); } catch (e){}
            handModel = null;
            window.setTimeout(function(){ if (gestureOn) ensureHandModel(); }, 900);
          }
        }
      }
      handPumpId = window.requestAnimationFrame(pump);
    })();
  }

  function startGesture(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      setHandState('浏览器不支持摄像头', 'warn');
      return;
    }
    gestureOn = true;
    syncHandUI();
    gestureBox.classList.add('on');
    setHandState('正在打开摄像头…', '');

    // 双击本地文件（file://）时浏览器经常不给摄像头，卡住不弹窗，这里兜个底提示
    var isFileMode = location.protocol === 'file:';
    var camTimer = window.setTimeout(function(){
      if (gestureOn && !handStream){
        setHandState(isFileMode ? '本地文件打不开摄像头，请用启动脚本或在线链接' : '摄像头没有响应，检查系统隐私设置', 'warn');
      }
    }, 6000);

    navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: 'user',
        width: { ideal: 480 },
        height: { ideal: 360 },
        frameRate: { ideal: 30, max: 30 }
      }
    }).then(function(stream){
      window.clearTimeout(camTimer);
      handStream = stream;
      handVideo.srcObject = stream;
      var p = handVideo.play();
      if (p && p.catch) p.catch(function(){});
      if (handModel || workerReady) startHandPump();
      else ensureHandModel();
    }).catch(function(err){
      window.clearTimeout(camTimer);
      gestureOn = false;
      syncHandUI();
      if (handStream){
        handStream.getTracks().forEach(function(t){ t.stop(); });
        handStream = null;
      }
      setHandState(err && err.name === 'NotAllowedError' ? '摄像头权限被拒绝' : '摄像头打开失败', 'warn');
      window.setTimeout(function(){
        if (!gestureOn) gestureBox.classList.remove('on');
      }, 2600);
    });
  }

  function stopGesture(){
    gestureOn = false;
    if (handPumpId){
      window.cancelAnimationFrame(handPumpId);
      handPumpId = 0;
    }
    syncHandUI();
    gestureBox.classList.remove('on');
    if (handStream){
      handStream.getTracks().forEach(function(t){ t.stop(); });
      handStream = null;
    }
    handVideo.srcObject = null;
    workerBusy = false;
    handPrevRot = null; handPrevX = null; handRotSm = 0;
    handPrevT = 0; handVel = 0;
    handCandidate = ''; handCandidateN = 0;
  }

  function syncHandUI(){
    btnHand.setAttribute('aria-pressed', gestureOn ? 'true' : 'false');
    handLabel.textContent = gestureOn ? '关闭手势' : '手势模式';
  }

  btnHand.addEventListener('click', function(){
    if (gestureOn) stopGesture(); else startGesture();
  });

  // 调试口子：喂 21 个点进来就能走一遍识别逻辑（不接摄像头也能测）
  window.__handDebug = {
    count: function(lm){ return handShape(lm); },
    feed: function(lm){ onHandLandmarks(lm); },
    angle: function(){ return angle; },
    burst: function(){ return burstTarget; },
    model: function(){ return workerReady ? 'worker' : (handModel ? 'main' : (handLoading ? 'loading' : 'none')); },
    error: function(){ return handPumpError || ''; },
    cost: function(){
      if (!handCost.length) return 'no-data';
      var a = handCost.slice(), s = 0, mx = 0;
      for (var i = 0; i < a.length; i++){ s += a[i]; if (a[i] > mx) mx = a[i]; }
      return Math.round(s / a.length) + 'ms avg / ' + Math.round(mx) + 'ms max / n=' + a.length;
    },
    initModel: function(){ ensureHandModel(); return handLoading; },
    detectCanvas: function(){
      if (!handModel) return 'no-model';
      var c = document.createElement('canvas');
      c.width = 320; c.height = 240;
      var g = c.getContext('2d');
      g.fillStyle = '#101820'; g.fillRect(0, 0, 320, 240);
      try {
        var res = handModel.detectForVideo(c, Math.round(performance.now()));
        return 'hands=' + (res.landmarks ? res.landmarks.length : 'n/a');
      } catch (e){
        return 'err=' + e.message;
      }
    }
  };

      if (gestureOn) stopGesture();

  var resizeTimer = 0;
  window.addEventListener('resize', function(){
    if (resizeTimer) window.clearTimeout(resizeTimer);

  // 手机横竖屏切换 / 地址栏收起时，resize 事件不一定来；用 ResizeObserver 兜住，
  // 否则画布像素尺寸还停在旧方向，整幅画面（尤其照片）会被拉宽

  /* ==========================================================================
     7.5 挂在树上的照片：可添加、随树旋转、散开时飘到四周
     ========================================================================== */
  var photoc = document.getElementById('photo');
  var pctx = photoc.getContext('2d');
  var photos = [];
  var PHOTO_MAX = 24;
  var photoClock = 0;
  var photoInput = document.getElementById('photoInput');
  var btnPhoto = document.getElementById('btnPhoto');
  var photoLabel = document.getElementById('photoLabel');
  var btnClearPhotos = document.getElementById('btnClearPhotos');
  var toastEl = document.getElementById('toast');
  var toastTimer = 0;

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    if (toastTimer) window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function(){ toastEl.classList.remove('on'); }, 2600);
  }

  function smoothFade(t){
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return t * t * (3 - 2 * t);
  }

  function roundRectPath(ctx, x, y, w, h, r){
    if (r > w * 0.5) r = w * 0.5;
    if (r > h * 0.5) r = h * 0.5;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // 沿着圆锥面重新排一遍：合拢时挂在树上，散开时站成一圈光环
  function layoutPhotos(){
    var n = photos.length;
    for (var i = 0; i < n; i++){
      var p = photos[i];
      var t = (i + 0.5) / n;
      var h = 0.14 + 0.76 * t;
      p.yT = TREE_HEIGHT * h + 0.15 + p.rnd * 0.35;
      p.rT = Math.max(1.25, Math.pow(1 - h, 1.1) * 3.35 * 1.04) + p.rnd * 0.3;
      p.haloR = 4.45 + p.rnd * 1.0;
      p.haloY = 1.9 + 5.9 * t;
    }
    updatePhotoUI();
  }

  function updatePhotoUI(){
    var n = photos.length;
    photoLabel.textContent = n ? '加照片 ' + n : '加照片';
    btnClearPhotos.style.display = n ? '' : 'none';
  }

  function addPhotoCanvas(cv, aspect, bg){
    if (photos.length >= PHOTO_MAX){
      showToast('最多 24 张，先清空一些');
      return;
    }
    var idx = photos.length;
    var p = {
      img: cv,
      bg: bg || null,
      aspect: aspect,
      rnd: Math.random(),
      seed: Math.random(),
      a0: idx * 2.39996 + Math.random() * 0.22,   // 黄金角，分布不扎堆
      r: 0, rT: 0, y: 0, yT: 0,
      haloR: 5.5, haloY: 0,
      appear: 0,
      tilt: 0                      // 保持正正直立，避免倾斜看起来"变宽"
    };
    photos.push(p);
    layoutPhotos();
    p.r = p.rT;
    p.y = p.yT;
  }

  function drawPhotos(){
    pctx.setTransform(1, 0, 0, 1, 0, 0);
    pctx.clearRect(0, 0, PW, PH);
    var n = photos.length;
    if (!n) return;

    var c = Math.cos(angle), s = Math.sin(angle);
    var cp = Math.cos(PITCH), sp = Math.sin(PITCH);
    var cx = PW * 0.5, cy = PH * 0.5;
    var sc = SCALE * zoom;
    var fBase = VH * 0.63;
    var list = [];
    var i, p, rr, yy, x, z, xz, zz, yp, zp, f, sx, sy, w;

    for (i = 0; i < n; i++){
      p = photos[i];
      if (p.appear < 0.02) continue;

      rr = p.r + (p.haloR - p.r) * burst;                                  // 合拢→散开是连续插值
      yy = p.y + (p.haloY - p.y) * burst + Math.sin(photoClock * 0.55 + p.seed * TAU) * 0.05;

      x = Math.cos(p.a0) * rr;
      z = Math.sin(p.a0) * rr;

      xz = x * c - z * s;
      zz = x * s + z * c;
      yp = yy * cp - zz * sp;
      zp = yy * sp + zz * cp;
      zp += CAM_DIST;
      yp -= CAM_HEIGHT;
      if (zp < 0.6) continue;

      f = fBase / zp;
      sx = cx + xz * f * sc;
      sy = cy - yp * f * sc + panY;
      w = 1.22 * f * sc;
      if (w < 6) continue;
      list.push({ p: p, sx: sx, sy: sy, zp: zp, w: w, dep: zz / Math.max(0.75, rr) });
    }

    // 远的先画，近的盖在上面
    list.sort(function(a, b){ return b.zp - a.zp; });

    for (i = 0; i < list.length; i++){
      var it = list[i];
      p = it.p;
      w = it.w;
      // 转进背面时逐渐透明到看不见，转回来再渐渐出现
      var fade = 1 - smoothFade((it.dep - 0.34) / 0.54);
      if (fade < 0.03) continue;
      // 宽高比只用照片画布自己的尺寸，绝不信任任何缓存值，杜绝"被拉宽"
      var ar = (p.img && p.img.width) ? (p.img.height / p.img.width) : p.aspect;
      var hh = w * ar;
      p._lastW = w; p._lastH = hh;
      var rad = w * 0.1;
      var hair = Math.max(1, w * 0.014);        // 极细的一道亮边

      pctx.save();
      pctx.globalAlpha = p.appear * fade * 0.94;
      pctx.translate(it.sx, it.sy);

      // 背后一层柔和冷光，让照片从粒子堆里"浮"起来
      pctx.shadowColor = 'rgba(150,205,255,.45)';
      pctx.shadowBlur = Math.min(26, w * 0.22);
      pctx.fillStyle = 'rgba(226,244,255,.12)';
      roundRectPath(pctx, -w * 0.5, -hh * 0.5, w, hh, rad);
      pctx.fill();

      pctx.shadowBlur = 0;
      pctx.shadowColor = 'transparent';

      // 照片本体：整块铺满，不内缩，比例和原图完全一致（圆角裁切）
      pctx.save();
      roundRectPath(pctx, -w * 0.5, -hh * 0.5, w, hh, rad);
      pctx.clip();
      pctx.drawImage(p.img, -w * 0.5, -hh * 0.5, w, hh);
      pctx.restore();

      // 细亮边（描在画面内侧，不改变照片可视区比例）
      pctx.lineWidth = hair;
      pctx.strokeStyle = 'rgba(233,246,255,.85)';
      roundRectPath(pctx, -w * 0.5 + hair * 0.5, -hh * 0.5 + hair * 0.5, w - hair, hh - hair, rad);
      pctx.stroke();

      pctx.restore();
    }
    pctx.globalAlpha = 1;
  }

  function updatePhotos(dt){
    photoClock += dt;
    var kA = 1 - Math.exp(-dt * 3.2);     // 出现的淡入
    var kP = 1 - Math.exp(-dt * 5.5);     // 重新排位时的柔滑移动
    for (var i = 0; i < photos.length; i++){
      var p = photos[i];
      if (p.appear < 1) p.appear += (1 - p.appear) * kA;
      p.r += (p.rT - p.r) * kP;
      p.y += (p.yT - p.y) * kP;
    }
  }

  /* ---------- 照片持久化：缩略图存本地 IndexedDB，刷新还在 ---------- */
  var photoDB = null;
  var photoDBOpened = false;

  function openPhotoDB(){
    if (photoDBOpened) return;
    photoDBOpened = true;
    if (typeof indexedDB === 'undefined') return;
    try {
      var req = indexedDB.open('christmas-tree-photos', 1);
      req.onupgradeneeded = function(e){
        var db = e.target.result;
        if (!db.objectStoreNames.contains('items')) db.createObjectStore('items', { autoIncrement: true });
      };
      req.onsuccess = function(e){
        photoDB = e.target.result;
        loadSavedPhotos();
      };
      req.onerror = function(){ photoDB = null; };
    } catch (err){ photoDB = null; }
  }

  function saveThumb(blob){
    if (!photoDB || !blob) return;
    try {
      photoDB.transaction('items', 'readwrite').objectStore('items').add(blob);
    } catch (err){}
  }

  function clearSavedPhotos(){
    if (!photoDB) return;
    try { photoDB.transaction('items', 'readwrite').objectStore('items').clear(); } catch (err){}
  }

  function loadSavedPhotos(){
    if (!photoDB) return;
    try {
      var req = photoDB.transaction('items', 'readonly').objectStore('items').getAll();
      req.onsuccess = function(){
        var blobs = req.result || [];
        for (var i = 0; i < blobs.length && photos.length < PHOTO_MAX; i++) loadImageFromBlob(blobs[i], false);
      };
    } catch (err){}
  }

  var PHOTO_PREVIEW_MAX = 1600;   // 只是显示用的清晰预览；原图原封不动存本地

  // 只读文件头（最多 256KB），拿 JPEG 的 EXIF 方向和原始像素尺寸；非 JPEG 给默认值
  function readJpegMeta(buf){
    var meta = { o: 1, w: 0, h: 0 };
    try {
      var dv = new DataView(buf), len = dv.byteLength, off = 2;
      if (len < 8 || dv.getUint16(0) !== 0xFFD8) return meta;
      while (off + 4 <= len){
        if (dv.getUint8(off) !== 0xFF){ off++; continue; }
        var m = dv.getUint8(off + 1);
        if (m === 0x01 || (m >= 0xD0 && m <= 0xD9)){ off += 2; continue; }
        if (m === 0xDA) break;
        var size = dv.getUint16(off + 2);
        if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC && off + 9 <= len){
          meta.h = dv.getUint16(off + 5);       // SOF：高在前，宽在后
          meta.w = dv.getUint16(off + 7);
        } else if (m === 0xE1 && off + 10 <= len && dv.getUint32(off + 4) === 0x45786966){
          var tiff = off + 10;
          var le = dv.getUint16(tiff) === 0x4949;
          var ifd = tiff + (le ? dv.getUint32(tiff + 4, true) : dv.getUint32(tiff + 4));
          var n = le ? dv.getUint16(ifd, true) : dv.getUint16(ifd);
          for (var i = 0; i < n && ifd + 2 + i * 12 + 12 <= len; i++){
            var e = ifd + 2 + i * 12;
            var tag = le ? dv.getUint16(e, true) : dv.getUint16(e);
            if (tag === 0x0112){
              var v = le ? dv.getUint16(e + 8, true) : dv.getUint16(e + 8);
              if (v >= 1 && v <= 8) meta.o = v;
              break;
            }
          }
        }
        off += 2 + size;
      }
    } catch (err){}
    return meta;
  }

  // 判断位图是否仍是"原始方向"：需要我们自己按 EXIF 摆正
  function bitmapIsRaw(bm, meta){
    if (!meta.w || !meta.h || meta.o < 5) return false;
    var aRaw = meta.w / meta.h;       // 原始（横向）宽高比
    var aDisp = meta.h / meta.w;      // 摆正后（竖向）宽高比
    if (Math.abs(aRaw - aDisp) < 0.02) return false;
    var aBm = bm.width / bm.height;
    return Math.abs(aBm - aRaw) < Math.abs(aBm - aDisp);
  }

  // 按 EXIF 方向把位图摆正（2~8 的镜像/旋转），返回摆正后的画布
  function uprightCanvas(src, o, needRotate){
    var sw = Math.max(1, src.width), sh = Math.max(1, src.height);
    var swap = needRotate && o >= 5 && o <= 8;
    var cw = swap ? sh : sw, ch = swap ? sw : sh;
    var cv = document.createElement('canvas');
    cv.width = cw;
    cv.height = ch;
    var g = cv.getContext('2d');
    if (needRotate){
      switch (o){
        case 2: g.transform(-1, 0, 0, 1, cw, 0); break;
        case 3: g.transform(-1, 0, 0, -1, cw, ch); break;
        case 4: g.transform(1, 0, 0, -1, 0, ch); break;
        case 5: g.transform(0, 1, 1, 0, 0, 0); break;
        case 6: g.transform(0, 1, -1, 0, cw, 0); break;
        case 7: g.transform(0, -1, -1, 0, cw, ch); break;
        case 8: g.transform(0, -1, 1, 0, 0, ch); break;
      }
    }
    g.drawImage(src, 0, 0);
    return cv;
  }

  // 只缩不放，生成清晰预览；宽高比严格来自摆正后的画布
  function shrinkCanvas(cv, done){
    var k = Math.min(1, PHOTO_PREVIEW_MAX / Math.max(cv.width, cv.height));
    if (k >= 1){ done(cv); return; }
    var c2 = document.createElement('canvas');
    c2.width = Math.max(1, Math.round(cv.width * k));
    c2.height = Math.max(1, Math.round(cv.height * k));
    var g = c2.getContext('2d');
    g.imageSmoothingEnabled = true;
    if ('imageSmoothingQuality' in g) g.imageSmoothingQuality = 'high';
    g.drawImage(cv, 0, 0, c2.width, c2.height);
    done(c2);
  }

  // [studio] 暴露给 i-boot.js：分享/预览时把照片画进树
  window.addPhotoCanvas = addPhotoCanvas;
  window.__I_PHOTO_MAX = PHOTO_MAX;

  function loadImageFromBlob(blob, persist){
    function accept(cv){
      addPhotoCanvas(cv, cv.height / cv.width);   // 宽高比只认画布自身尺寸
      if (persist) saveThumb(blob);               // 存的是原文件，不重新压
    }

    function fallback(){
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function(){
        URL.revokeObjectURL(url);
        blob.slice(0, 256 * 1024).arrayBuffer().then(function(buf){
          var meta = readJpegMeta(buf);
          var iw = Math.max(1, img.naturalWidth || 1);
          var ih = Math.max(1, img.naturalHeight || 1);
          var swap = meta.o >= 5 && meta.o <= 8;
          var cv;
          if (meta.w && swap && Math.abs(iw / meta.w - 1) < 0.02 && Math.abs(ih / meta.h - 1) < 0.02){
            // 少数浏览器 naturalWidth 还是原始方向，但 drawImage 会把像素摆正
            cv = document.createElement('canvas');
            cv.width = ih;
            cv.height = iw;
            cv.getContext('2d').drawImage(img, 0, 0, ih, iw);
          } else {
            cv = document.createElement('canvas');
            cv.width = iw;
            cv.height = ih;
            cv.getContext('2d').drawImage(img, 0, 0);
          }
          shrinkCanvas(cv, accept);
        }).catch(function(){
          var cv2 = document.createElement('canvas');
          cv2.width = Math.max(1, img.naturalWidth || 1);
          cv2.height = Math.max(1, img.naturalHeight || 1);
          cv2.getContext('2d').drawImage(img, 0, 0);
          shrinkCanvas(cv2, accept);
        });
      };
      img.onerror = function(){
        URL.revokeObjectURL(url);
        showToast('有张照片读不出来');
      };
      img.src = url;
    }

    // 主路径：位图 + 自己解析 EXIF；万一浏览器给的是未摆正的原始像素，就手动摆正
    if (window.createImageBitmap){
      blob.slice(0, 256 * 1024).arrayBuffer().then(function(buf){
        var meta = readJpegMeta(buf);
        createImageBitmap(blob, { imageOrientation: 'from-image' }).then(function(bm){
          var rotate = bitmapIsRaw(bm, meta);
          var cv = uprightCanvas(bm, meta.o, rotate);
          try { bm.close(); } catch (e){}
          shrinkCanvas(cv, accept);
        }).catch(fallback);
      }).catch(fallback);
    } else {
      fallback();
    }
  }

  function handlePhotoFiles(list){
    if (!list || !list.length) return;
    var room = PHOTO_MAX - photos.length;
    var added = 0;
    for (var i = 0; i < list.length; i++){
      var f = list[i];
      if (!f || (f.type && f.type.indexOf('image/') !== 0)) continue;
      if (added >= room){ showToast('最多 24 张照片，先清空一些'); break; }
      added++;
      loadImageFromBlob(f, true);
    }
  }

  btnPhoto.addEventListener('click', function(){ photoInput.click(); });

  photoInput.addEventListener('change', function(){
    handlePhotoFiles(photoInput.files);
    photoInput.value = '';
  });

  btnClearPhotos.addEventListener('click', function(){
    photos = [];
    pctx.setTransform(1, 0, 0, 1, 0, 0);
    pctx.clearRect(0, 0, PW, PH);
    clearSavedPhotos();
    layoutPhotos();
    showToast('已清空照片');
  });

  stage.addEventListener('dragover', function(e){
    if (e.dataTransfer && e.dataTransfer.types && e.dataTransfer.types.indexOf('Files') >= 0){
      e.preventDefault();
    }
  });

  stage.addEventListener('drop', function(e){
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){

    }
  });

  // 调试口子：不选文件也能塞测试图进来
  window.__photoDebug = {

        var g = cv.getContext('2d');

        grd.addColorStop(1, 'hsl(' + Math.round(Math.random() * 360) + ',60%,45%)');
        g.fillStyle = grd;
        g.fillRect(0, 0, 240, 180);

    dims: function(){ return photos.map(function(p){ return p.img.width + 'x' + p.img.height; }); },
    rects: function(){ return photos.map(function(p){ return { w: Math.round(p._lastW || 0), h: Math.round(p._lastH || 0), ar: Math.round((p._lastH / Math.max(1, p._lastW)) * 1000) / 1000 }; }); }
  };

  /* ==========================================================================
     8. 背景音乐（自己添加的那首歌）
     ========================================================================== */
  var btnMusic = document.getElementById('btnMusic');
  var musicLabel = document.getElementById('musicLabel');
  var bgmInput = document.getElementById('bgmInput');
  var bgmAudio = document.getElementById('bgmAudio');
  var bgmOn = false;
  var localBGM = null;          // 用户自己选的那首歌 { url, name }

  function syncBGMUI(){
    btnMusic.setAttribute('aria-pressed', bgmOn ? 'true' : 'false');
    musicLabel.textContent = localBGM ? (bgmOn ? '音乐中' : '音乐') : '加音乐';
    btnMusic.setAttribute('aria-label', localBGM ? (bgmOn ? '暂停音乐' : '播放音乐') : '添加音乐');
    btnMusic.title = localBGM
      ? ('当前：' + localBGM.name + '（点击' + (bgmOn ? '暂停' : '播放') + '，右键／长按清除）')
      : '点一下选一段自己的音乐（右键／长按清除）';
  }

  /* ---------- 本地音乐：存在浏览器里，刷新还在 ---------- */
  function openBgmDB(cb){
    try {
      var req = indexedDB.open('christmas-tree-bgm', 1);
      req.onupgradeneeded = function(e){
        var db = e.target.result;
        if (!db.objectStoreNames.contains('track')) db.createObjectStore('track');
      };
      req.onsuccess = function(e){ cb(e.target.result); };
      req.onerror = function(){ cb(null); };
    } catch (e){ cb(null); }
  }

  function saveLocalBGM(blob, name){
    openBgmDB(function(db){
      if (!db) return;
      try {
        db.transaction('track', 'readwrite').objectStore('track').put({ blob: blob, name: name }, 'cur');
      } catch (e){}
    });
  }

  function deleteLocalBGM(){
    openBgmDB(function(db){
      if (!db) return;
      try { db.transaction('track', 'readwrite').objectStore('track').delete('cur'); } catch (e){}
    });
  }

  function setLocalBGM(url, name, persist, blob){
    if (localBGM && localBGM.url && localBGM.url.indexOf('blob:') === 0){
      try { URL.revokeObjectURL(localBGM.url); } catch (e){}
    }
    localBGM = { url: url, name: name };
    bgmAudio.src = url;
    if (persist && blob) saveLocalBGM(blob, name);
    syncBGMUI();
  }

  function restoreLocalBGM(){
    openBgmDB(function(db){
      if (!db) return;
      try {
        var r = db.transaction('track', 'readonly').objectStore('track').get('cur');
        r.onsuccess = function(){
          var v = r.result;
          if (v && v.blob) setLocalBGM(URL.createObjectURL(v.blob), v.name || '本地音乐', false);
        };
      } catch (e){}
    });
  }

  function startBGM(){
    if (!localBGM){
      openBgmPicker();
      return;
    }
    bgmOn = true;
    syncBGMUI();
    try { bgmAudio.volume = 0.6; } catch (e){}
    var p = bgmAudio.play();
    if (p && p.catch) p.catch(function(){
      showToast('浏览器拦下了自动播放，再点一下试试');
    });
  }

  function stopBGM(){
    bgmOn = false;
    syncBGMUI();
    try { bgmAudio.pause(); } catch (e){}
  }

  function toggleBGM(){
    if (!localBGM){ openBgmPicker(); return; }
    if (bgmOn) stopBGM(); else startBGM();
    try { localStorage.setItem('tree-bgm', bgmOn ? '1' : '0'); } catch (e){}
  }

  function clearLocalBGM(){
    bgmOn = false;
    if (localBGM && localBGM.url) try { URL.revokeObjectURL(localBGM.url); } catch (e){}
    localBGM = null;
    try {
      bgmAudio.pause();
      bgmAudio.removeAttribute('src');
      bgmAudio.load();
    } catch (e){}
    deleteLocalBGM();
    syncBGMUI();
    try { localStorage.setItem('tree-bgm', '0'); } catch (e){}
    showToast('已清除音乐，点「加音乐」再选一首');
  }

  function openBgmPicker(){
    bgmInput.value = '';
    bgmInput.click();
  }

  // 点一下：没歌就选文件，有歌就播放／暂停；右键或长按清除
  var lpTimer = 0, lpFired = false;
  btnMusic.addEventListener('pointerdown', function(){
    lpFired = false;
    if (lpTimer) window.clearTimeout(lpTimer);
    lpTimer = window.setTimeout(function(){ lpFired = true; lpTimer = 0; clearLocalBGM(); }, 850);
  });
  function cancelLongPress(){
    if (lpTimer){ window.clearTimeout(lpTimer); lpTimer = 0; }
  }
  btnMusic.addEventListener('pointerup', cancelLongPress);
  btnMusic.addEventListener('pointerleave', cancelLongPress);
  btnMusic.addEventListener('pointercancel', cancelLongPress);
  btnMusic.addEventListener('click', function(e){
    e.stopPropagation();
    if (lpFired){ lpFired = false; return; }
    toggleBGM();
  });
  btnMusic.addEventListener('contextmenu', function(e){
    e.preventDefault();
    if (localBGM) clearLocalBGM();
  });

  bgmInput.addEventListener('change', function(){
    var f = bgmInput.files && bgmInput.files[0];
    if (!f) return;
    if (f.size > 60 * 1024 * 1024){
      showToast('音乐文件太大了（上限 60MB）');
      return;
    }
    setLocalBGM(URL.createObjectURL(f), f.name, true, f);
    startBGM();
    try { localStorage.setItem('tree-bgm', '1'); } catch (e){}
    showToast('已加入：' + f.name + '（右键／长按可清除）');
  });

  bgmAudio.addEventListener('error', function(){
    if (localBGM) showToast('这个音频浏览器放不了，换一首试试');
  });

  restoreLocalBGM();

  window.__bgmDebug = {
    on: function(){ return bgmOn; },
    local: function(){ return !!localBGM; },
    name: function(){ return localBGM ? localBGM.name : ''; },
    audioState: function(){ return bgmAudio.paused ? 'paused' : 'playing'; },
    setLocal: function(blob, name){ setLocalBGM(URL.createObjectURL(blob), name || 'test.wav', true, blob); },
    clear: function(){ clearLocalBGM(); }
  };

  // 上次开着音乐：等第一次操作页面时再起（浏览器不允许无交互自动播放）
  try {
    if (localStorage.getItem('tree-bgm') === '1'){
      var armBGM = function(ev){
        if (ev && ev.target && ev.target.closest && ev.target.closest('#drawer') || ev.target.closest('#menuFab')) return;
        window.removeEventListener('pointerdown', armBGM);
        window.removeEventListener('keydown', armBGM);
        if (!bgmOn && localBGM){
          startBGM();
          suppressTap = true;   // 这一下只当"开音乐"，不让树跟着散开
        }
      };
      window.addEventListener('pointerdown', armBGM);
      window.addEventListener('keydown', armBGM);
    }
  } catch (e){}

  /* ==========================================================================
     9. 界面隐藏（截图／录屏）
     ========================================================================== */
  var stageEl = document.getElementById('stage');
  var dockEl = document.querySelector('.dock');
  var btnHideUI = document.getElementById('btnHideUI');
  var uiPeek = document.getElementById('uiPeek');
  var menuFabEl = document.getElementById('menuFab');
  var drawerEl = document.getElementById('drawer');
  var drawerCloseEl = document.getElementById('drawerClose');
  var drawerOpen = false;
  var uiPinned = false;      // H / 「隐藏按钮」：彻底隐藏，只能手动恢复
  var uiIdleTimer = 0, peekTimer = 0, overDock = false, lastPeek = 0;

  function showUI(){
    stageEl.classList.remove('ui-idle');
    stageEl.classList.remove('ui-hide');
  }
  function armIdle(){
    if (uiIdleTimer) window.clearTimeout(uiIdleTimer);
    if (uiPinned || drawerOpen) return;
    uiIdleTimer = window.setTimeout(function(){
      if (!uiPinned && !overDock && !drawerOpen) stageEl.classList.add('ui-idle');
    }, 4200);
  }
  function flashPeek(){
    if (!uiPinned) return;
    var now = Date.now();
    if (now - lastPeek < 160) return;
    lastPeek = now;
    uiPeek.classList.add('show');
    if (peekTimer) window.clearTimeout(peekTimer);
    peekTimer = window.setTimeout(function(){ uiPeek.classList.remove('show'); }, 2400);
  }
  function poke(){
    if (uiPinned){ flashPeek(); return; }
    showUI();
    armIdle();
  }
  function setPinned(on){
    if (on) setDrawerOpen(false);
    uiPinned = on;
    btnHideUI.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (uiIdleTimer) window.clearTimeout(uiIdleTimer);
    if (on){
      stageEl.classList.add('ui-hide');
      showToast('界面已隐藏 · 按 H 或点右下角小圆点恢复');
    } else {
      showUI();
      uiPeek.classList.remove('show');
      armIdle();
    }
  }

  // ---------- 功能抽屉：点右下角「功能」展开，再点收起 ----------
  function setDrawerOpen(on){
    drawerOpen = !!on;
    drawerEl.classList.toggle('open', drawerOpen);
    drawerEl.setAttribute('aria-hidden', drawerOpen ? 'false' : 'true');
    menuFabEl.setAttribute('aria-expanded', drawerOpen ? 'true' : 'false');
    if (drawerOpen){
      showUI();
      if (uiIdleTimer) window.clearTimeout(uiIdleTimer);
    } else {
      armIdle();
    }
  }
  menuFabEl.addEventListener('click', function(e){
    e.stopPropagation();
    setDrawerOpen(!drawerOpen);
  });
  drawerCloseEl.addEventListener('click', function(e){
    e.stopPropagation();
    setDrawerOpen(false);
  });
  drawerEl.addEventListener('click', function(e){
    var c = e.target && e.target.closest && e.target.closest('.ctrl');
    if (c && c.id !== 'btnHideUI'){
      window.setTimeout(function(){ setDrawerOpen(false); }, 90);
    }
  });

  btnHideUI.addEventListener('click', function(e){ e.stopPropagation(); setPinned(true); });
  uiPeek.addEventListener('click', function(e){ e.stopPropagation(); setPinned(false); });
  window.addEventListener('keydown', function(e){
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    if (t && t.closest && t.closest('[contenteditable="true"],input,textarea')) return;
    if (e.key === 'Escape'){ setDrawerOpen(false); return; }
    if (e.key === 'm' || e.key === 'M'){ toggleBGM(); return; }
    if (e.key === 'h' || e.key === 'H'){ setPinned(!uiPinned); }
  });
  window.addEventListener('pointermove', poke, {passive:true});
  window.addEventListener('pointerdown', poke, {passive:true});
  window.addEventListener('wheel', poke, {passive:true});
  dockEl.addEventListener('pointerenter', function(){ overDock = true; if (!uiPinned) showUI(); });
  dockEl.addEventListener('pointerleave', function(){ overDock = false; armIdle(); });
  armIdle();

  /* ==========================================================================
     9. 启动
     ========================================================================== */
  resize();

  if (reduced){
    // 尊重减弱动态：停在稳定的一帧
    updateSnow(0.5);
    renderFrame();
  } else {
    start();
  }

  // 页面稳定后偷偷把手势模型拉到本地，用户点按钮时就不用干等
  window.setTimeout(prefetchHandAssets, 3500);

  // 恢复上次加过的照片缩略图
  openPhotoDB();

  // 这版把手势识别挪进 Worker、恢复全分辨率；加载时提示一次，方便确认不是缓存
  try {
    var BUILD_TAG = 'v3.0-worker-hand';
    if (localStorage.getItem('tree-build') !== BUILD_TAG){
      localStorage.setItem('tree-build', BUILD_TAG);
      window.setTimeout(function(){ showToast('手势识别已转到后台线程，开着手势也满帧'); }, 1200);
    }
  } catch (ignore){}

  // 调试口子：地址带 debug=1 时把帧率和识别耗时写进标题，方便远程看数据
  if (location.search.indexOf('handselftest=1') >= 0) ensureHandModel();
  if (location.search.indexOf('debug=1') >= 0){
    var diagFrames = 0;
    (function diagLoop(){ diagFrames++; window.requestAnimationFrame(diagLoop); })();
    window.setInterval(function(){
      var c = '-';
      if (handCost.length){
        var s = 0;
        for (var i = 0; i < handCost.length; i++) s += handCost[i];
        c = Math.round(s / handCost.length) + '/' + Math.round(Math.max.apply(null, handCost)) + 'ms';
      }
      document.title = 'fps ' + diagFrames + ' | ' + (workerReady ? 'W' : (handModel ? 'M' : '-')) + ' | ' + c + ' | ' + (handStateTxt ? handStateTxt.textContent : '');
      diagFrames = 0;
    }, 1000);
  }
})();
</script>
</body>
</html>
