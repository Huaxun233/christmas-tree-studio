<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纯CSS动画圣诞树 · Demo01</title>
<meta name="robots" content="noindex">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:linear-gradient(180deg,#0b1e3a 0%,#12315e 60%,#1a4a3a 100%); font-family:sans-serif; overflow:hidden; }
.scene { position:relative; width:300px; height:420px; }
/* 三层三角形树身 */
.tri { position:absolute; left:50%; transform:translateX(-50%); width:0; height:0;
  border-left:70px solid transparent; border-right:70px solid transparent; border-bottom:110px solid #1d7a44; }
.tri::after { content:""; position:absolute; left:-70px; top:0; width:0; height:0;
  border-left:70px solid transparent; border-right:70px solid transparent; border-bottom:110px solid #2a9d5c;
  clip-path:polygon(0 0,100% 0,50% 100%); }
.t1 { bottom:200px; }
.t2 { bottom:120px; border-left-width:90px; border-right-width:90px; border-bottom-width:140px; }
.t2::after { left:-90px; border-left-width:90px; border-right-width:90px; border-bottom-width:140px; }
.t3 { bottom:20px; border-left-width:110px; border-right-width:110px; border-bottom-width:170px; }
.t3::after { left:-110px; border-left-width:110px; border-right-width:110px; border-bottom-width:170px; }
/* 树干 */
.trunk { position:absolute; left:50%; transform:translateX(-50%); bottom:0; width:34px; height:26px;
  background:#6b4423; border-radius:0 0 6px 6px; }
/* 顶星：两步动画闪烁 */
.star { position:absolute; left:50%; bottom:395px; transform:translateX(-50%); font-size:34px;
  animation:twinkle 1.6s ease-in-out infinite; }
@keyframes twinkle { 0%,100% { transform:translateX(-50%) scale(1); filter:drop-shadow(0 0 4px #ffd76a); }
  50% { transform:translateX(-50%) scale(1.35); filter:drop-shadow(0 0 18px #ffd76a); } }
/* 彩灯：绝对定位圆点，交替闪烁 */
.light { position:absolute; width:10px; height:10px; border-radius:50%; animation:blink 1.2s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity:1; box-shadow:0 0 8px 2px currentColor; } 50% { opacity:.25; box-shadow:none; } }
/* 雪花飘落 */
.snow { position:absolute; top:-10px; color:#fff; opacity:.8; animation:fall linear infinite; }
@keyframes fall { to { transform:translateY(110vh) rotate(360deg); } }
h1 { color:#fff; letter-spacing:.3em; font-size:20px; margin-bottom:20px; text-shadow:0 0 10px rgba(255,255,255,.4); }
</style>
</head>
<body>
<h1>纯CSS动画圣诞树</h1>
<div class="scene">
  <div class="star">★</div>
  <div class="tri t1"></div><div class="tri t2"></div><div class="tri t3"></div>
  <div class="trunk"></div>
  <!-- 彩灯坐标手工分布在三层树身上 -->
  <div class="light" style="left:130px;bottom:280px;background:#ff5252;"></div>
  <div class="light" style="left:175px;bottom:255px;background:#ffd740;animation-delay:.3s;"></div>
  <div class="light" style="left:105px;bottom:250px;background:#40c4ff;animation-delay:.6s;"></div>
  <div class="light" style="left:150px;bottom:205px;background:#ff5252;animation-delay:.15s;"></div>
  <div class="light" style="left:115px;bottom:185px;background:#69f0ae;animation-delay:.45s;"></div>
  <div class="light" style="left:185px;bottom:175px;background:#ffd740;animation-delay:.75s;"></div>
  <div class="light" style="left:150px;bottom:120px;background:#40c4ff;animation-delay:.2s;"></div>
  <div class="light" style="left:95px;bottom:100px;background:#ff5252;animation-delay:.5s;"></div>
  <div class="light" style="left:205px;bottom:90px;background:#69f0ae;animation-delay:.8s;"></div>
  <div class="light" style="left:150px;bottom:55px;background:#ffd740;animation-delay:.35s;"></div>
</div>
<script>
// 雪花由少量 JS 生成（纯 CSS 也可，但随机化用 JS 更自然）
for (let i = 0; i < 40; i++) {
  const s = document.createElement("div");
  s.className = "snow"; s.textContent = "❄";
  s.style.left = Math.random() * 100 + "vw";
  s.style.fontSize = 8 + Math.random() * 12 + "px";
  s.style.animationDuration = 6 + Math.random() * 8 + "s";
  s.style.animationDelay = -Math.random() * 10 + "s";
  document.body.appendChild(s);
}
</script>
</body>
</html>
