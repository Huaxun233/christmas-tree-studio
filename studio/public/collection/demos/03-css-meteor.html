<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纯CSS流星圣诞树 · Demo03</title>
<meta name="robots" content="noindex">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:linear-gradient(180deg,#02040f 0%,#0a1030 100%); overflow:hidden; font-family:sans-serif; }
h1 { color:#cfe0ff; letter-spacing:.3em; font-size:20px; margin-bottom:10px; z-index:2; }
.scene { position:relative; width:340px; height:440px; z-index:2; }
/* 流星树身：发光锥形三层，青蓝辉光 */
.layer { position:absolute; left:50%; transform:translateX(-50%);
  border-left:60px solid transparent; border-right:60px solid transparent;
  border-bottom:95px solid rgba(60,180,255,.85);
  filter:drop-shadow(0 0 18px rgba(80,200,255,.6)); }
.l1 { bottom:210px; }
.l2 { bottom:125px; border-left-width:85px; border-right-width:85px; border-bottom-width:130px; }
.l3 { bottom:25px; border-left-width:105px; border-right-width:105px; border-bottom-width:160px; }
.star { position:absolute; left:50%; bottom:400px; transform:translateX(-50%); font-size:32px; color:#fff;
  text-shadow:0 0 20px #7fd0ff, 0 0 40px #7fd0ff; animation:star 2s ease-in-out infinite; }
@keyframes star { 50% { transform:translateX(-50%) scale(1.3); } }
.trunk { position:absolute; left:50%; transform:translateX(-50%); bottom:0; width:30px; height:26px; background:#3a2a55; border-radius:0 0 6px 6px; }
/* 流星：斜向拖尾划过 */
.meteor { position:absolute; top:0; left:0; width:2px; height:80px;
  background:linear-gradient(180deg,rgba(255,255,255,0) 0%,#fff 80%,transparent 100%);
  transform:rotate(-40deg); opacity:0; animation:shoot linear infinite; }
@keyframes shoot {
  0% { transform:translate(0,0) rotate(-40deg); opacity:0; }
  5% { opacity:1; }
  30% { transform:translate(-420px,340px) rotate(-40deg); opacity:0; }
  100% { transform:translate(-420px,340px) rotate(-40deg); opacity:0; }
}
</style>
</head>
<body>
<h1>纯CSS流星圣诞树</h1>
<div class="scene">
  <div class="star">✦</div>
  <div class="layer l1"></div><div class="layer l2"></div><div class="layer l3"></div>
  <div class="trunk"></div>
</div>
<script>
// 8 颗流星：随机起点与周期，右上向左下划过
for (let i = 0; i < 8; i++) {
  const m = document.createElement("div");
  m.className = "meteor";
  m.style.left = (60 + Math.random() * 40) + "vw";
  m.style.top = (Math.random() * 30) + "vh";
  m.style.animationDuration = 4 + Math.random() * 5 + "s";
  m.style.animationDelay = Math.random() * 6 + "s";
  document.body.appendChild(m);
}
</script>
</body>
</html>
